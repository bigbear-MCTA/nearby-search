<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<title>近くのお店・温泉を探す</title>
<style>
body {
    font-family: sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 15px;
}

#status {
    text-align: center;
    padding: 12px;
    margin-bottom: 18px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 7px #ddd;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button {
    font-size: 18px;
    padding: 20px 8px;
    border: none;
    border-radius: 14px;
    background: white;
    box-shadow: 0 2px 7px #ccc;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.note {
    text-align: center;
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 近くを探す</h1>

<div class="subtitle">
今いる場所の近くから探します
</div>

<div id="status">
📍 現在地を確認中…
</div>

<div class="grid">

<button onclick="searchMap('日帰り温泉')">♨️<br>日帰り温泉</button>
<button onclick="searchMap('ラーメン')">🍜<br>ラーメン</button>

<button onclick="searchMap('定食 食堂')">🍚<br>定食・食堂</button>
<button onclick="searchMap('そば うどん')">🥢<br>そば・うどん</button>

<button onclick="searchMap('寿司')">🍣<br>寿司</button>
<button onclick="searchMap('焼肉')">🥩<br>焼肉</button>

<button onclick="searchMap('居酒屋')">🍺<br>居酒屋</button>
<button onclick="searchMap('カフェ')">☕<br>カフェ</button>

<button onclick="searchMap('中華料理')">🥟<br>中華</button>
<button onclick="searchMap('レストラン')">🍴<br>その他の食事</button>

</div>

<div class="note">
検索結果はGoogleマップで表示します
</div>

</div>

<script>

let latitude = null;
let longitude = null;

function getLocation() {

    if (!navigator.geolocation) {
        document.getElementById("status").innerHTML =
        "⚠️ この端末では現在地を取得できません";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            latitude = position.coords.latitude;
            longitude = position.coords.longitude;

            document.getElementById("status").innerHTML =
            "✅ 現在地を取得しました";
        },

        function(error) {

            document.getElementById("status").innerHTML =
            "⚠️ 現在地を取得できませんでした<br>Googleマップ側の現在地を利用します";
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
        }
    );
}

function searchMap(keyword) {

    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(keyword);

    window.open(url, "_blank");
}

getLocation();

</script>

</body>
</html>
