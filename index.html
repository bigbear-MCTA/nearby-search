<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<title>近くのお店・温泉を探す</title>

<style>
body {
    font-family: sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 15px;
}

#status {
    text-align: center;
    padding: 12px;
    margin-bottom: 18px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 7px #ddd;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button {
    font-size: 18px;
    padding: 20px 8px;
    border: none;
    border-radius: 14px;
    background: white;
    box-shadow: 0 2px 7px #ccc;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.result-card {
    background: white;
    padding: 15px;
    margin-top: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 7px #ccc;
}

.result-name {
    font-size: 18px;
    font-weight: bold;
}

.result-info {
    margin-top: 7px;
    color: #555;
    font-size: 14px;
    line-height: 1.6;
}

.map-link {
    display: block;
    margin-top: 10px;
    text-align: center;
    padding: 10px;
    background: #4285f4;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.note {
    text-align: center;
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 近くを探す</h1>

<div class="subtitle">
今いる場所の近くから探します
</div>

<div id="status">
📍 現在地を確認中…
</div>

<div class="grid">

<button onclick="searchNearbyOnsen()">♨️<br>日帰り温泉</button>
<button onclick="searchMap('ラーメン')">🍜<br>ラーメン</button>

<button onclick="searchMap('定食 食堂')">🍚<br>定食・食堂</button>
<button onclick="searchMap('そば うどん')">🥢<br>そば・うどん</button>

<button onclick="searchMap('寿司')">🍣<br>寿司</button>
<button onclick="searchMap('焼肉')">🥩<br>焼肉</button>

<button onclick="searchMap('居酒屋')">🍺<br>居酒屋</button>
<button onclick="searchMap('カフェ')">☕<br>カフェ</button>

<button onclick="searchMap('中華料理')">🥟<br>中華</button>
<button onclick="searchMap('レストラン')">🍴<br>その他の食事</button>

</div>

<div id="results"></div>

<div class="note">
現在地周辺のお店・施設を検索します
</div>

</div>

<script>

let latitude = null;
let longitude = null;

function getLocation() {

    if (!navigator.geolocation) {
        document.getElementById("status").textContent =
            "⚠️ この端末では現在地を取得できません";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            latitude = position.coords.latitude;
            longitude = position.coords.longitude;

            document.getElementById("status").textContent =
                "✅ 現在地を取得しました";
        },

        function() {

            document.getElementById("status").textContent =
                "⚠️ 現在地を取得できませんでした";
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
        }
    );
}


function searchMap(keyword) {

    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(keyword);

    window.open(url, "_blank");
}


/* 現在地から施設までの直線距離を計算 */
function distanceKm(lat1, lon1, lat2, lon2) {

    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}


async function searchNearbyOnsen() {

    document.getElementById("status").textContent =
        "📍 現在地を再取得しています…";

    try {
        const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(
                resolve,
                reject,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });

        latitude = position.coords.latitude;
        longitude = position.coords.longitude;

    } catch (error) {
        document.getElementById("status").textContent =
            "⚠️ 現在地を取得できませんでした";
        return;
    }    

    const status = document.getElementById("status");
    const results = document.getElementById("results");

    status.textContent =
        "♨️ 近くの日帰り温泉を検索中…";

    results.innerHTML = "";

    try {

        const { Place } =
            await google.maps.importLibrary("places");

        const request = {

            textQuery: "日帰り温泉",

            fields: [
                "displayName",
                "formattedAddress",
                "location",
                "googleMapsURI",
         "websiteURI", 
                "rating",
                "userRatingCount"
            ],

            locationBias: {
                center: {
                    lat: latitude,
                    lng: longitude
                },
                radius: 20000
            },

            maxResultCount: 10,

            language: "ja",
            region: "jp"
        };

        const { places } =
            await Place.searchByText(request);

        if (!places || places.length === 0) {

            status.textContent =
                "♨️ 近くの日帰り温泉が見つかりませんでした";

            return;
        }

        status.textContent =
            "♨️ " + places.length +
            "件の日帰り温泉が見つかりました";

places.sort(function(a, b) {

    const distanceA = distanceKm(
        latitude,
        longitude,
        a.location.lat(),
        a.location.lng()
    );

    const distanceB = distanceKm(
        latitude,
        longitude,
        b.location.lat(),
        b.location.lng()
    );

    return distanceA - distanceB;
});

        places.forEach(function(place, index) {

            const card =
                document.createElement("div");

            card.className = "result-card";


            const name =
                document.createElement("div");

            name.className = "result-name";

            name.textContent =
                (index + 1) + ". " +
                (place.displayName || "施設名不明");

            card.appendChild(name);


            const info =
                document.createElement("div");

            info.className = "result-info";


            /* 評価 */
            if (place.rating) {

                const rating =
                    document.createElement("div");

                rating.textContent =
                    "⭐ " +
                    place.rating.toFixed(1) +
                    "（口コミ " +
                    (place.userRatingCount || 0) +
                    "件）";

                info.appendChild(rating);
            }


            /* 距離 */
            if (place.location) {

                const distance =
                    distanceKm(
                        latitude,
                        longitude,
                        place.location.lat(),
                        place.location.lng()
                    );

                const distanceLine =
                    document.createElement("div");

                distanceLine.textContent =
                    "📍 現在地から約 " +
                    distance.toFixed(1) +
                    " km";

                info.appendChild(distanceLine);
            }


            /* 住所 */
            if (place.formattedAddress) {

                const address =
                    document.createElement("div");

                address.textContent =
                    place.formattedAddress;

                info.appendChild(address);
            }


            card.appendChild(info);

/* 公式ホームページ */
if (place.websiteURI) {

    const websiteLink =
        document.createElement("a");

    websiteLink.className = "map-link";
    websiteLink.href = place.websiteURI;
    websiteLink.target = "_blank";
    websiteLink.rel = "noopener noreferrer";

    websiteLink.textContent =
        "🌐 公式ホームページ";

    card.appendChild(websiteLink);
}

            /* Googleマップ */
            if (place.googleMapsURI) {

                const link =
                    document.createElement("a");

                link.className = "map-link";
                link.href = place.googleMapsURI;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                link.textContent =
                    "📍 Googleマップで見る";

                card.appendChild(link);
            }


            results.appendChild(card);

        });


        /* 検索結果までスクロール */
        results.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });


    } catch (error) {

        console.error(error);

        status.textContent =
            "⚠️ 温泉の検索でエラーが発生しました";
    }
}


getLocation();

</script>

<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtKlsgkwOzltTcup7cxY5DE-R1gFBhWSc&libraries=places&v=weekly"></script>

</body>
</html>
